<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Library</title>
<style>
:root{
  --bg:#f7f6f2;--panel:#ffffff;--ink:#1d1d1b;--muted:#6b6a64;--line:#e4e2da;
  --accent:#2f5d50;--accent-soft:#e3ece8;--chip:#efede6;
  --popgen:#6a4c93;--proteins:#1f6f8b;--immuno:#b5543c;--pp:#2f7d6d;--lab:#8a6d2c;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151513;--panel:#1d1d1b;--ink:#ecebe6;--muted:#a09e96;--line:#2e2d29;
  --accent:#8cc7b3;--accent-soft:#243631;--chip:#2a2926;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit}
header{padding:48px 24px 20px;max-width:1100px;margin:0 auto}
h1{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600;font-size:40px;letter-spacing:-.01em;margin:0 0 6px}
.sub{color:var(--muted);margin:0}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stat b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:0 24px 64px}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;user-select:none;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.65;font-variant-numeric:tabular-nums}
select{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 8px;border-radius:8px;font-size:13px}
.spacer{flex:1}
.count{color:var(--muted);font-size:13px}
.list{margin-top:8px}
.yr{font-family:"Iowan Old Style",Georgia,serif;font-size:20px;color:var(--muted);margin:26px 0 6px;font-variant-numeric:tabular-nums}
.paper{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.paper:hover{border-color:var(--accent)}
.title{font-weight:600;text-decoration:none;line-height:1.35}
.title:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.meta{color:var(--muted);font-size:13.5px;grid-column:1}
.meta i{font-style:italic}
.tags{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.k-review{background:#f3e7c4;color:#7a5a07}.tag.k-preprint{background:#dfe9f6;color:#2b5687}.tag.k-book{background:#dff0e2;color:#2e6b3a}
@media (prefers-color-scheme:dark){.tag.k-review{background:#3d331a;color:#e5c66d}.tag.k-preprint{background:#1d2b3d;color:#8fb4e3}.tag.k-book{background:#1e3322;color:#8fcf9b}}
.why{grid-column:1;font-size:13px;color:var(--accent)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
footer{max-width:1100px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:13px}
@media (max-width:640px){h1{font-size:30px}.paper{grid-template-columns:1fr}.tags{grid-column:1;grid-row:auto;flex-direction:row;flex-wrap:wrap;align-items:flex-start}}
</style>
</head>
<body>
<header>
  <h1>Research Library</h1>
  <p class="sub">Population genetics, protein biophysics and immunology · curated in JabRef, updated every week</p>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search titles, authors, journals…" autocomplete="off">
    <div class="row" id="secs"></div>
    <div class="row">
      <span class="chip" data-kind="review">⭐ Reviews</span>
      <span class="chip" data-kind="preprint">📘 Preprints</span>
      <span class="chip" data-kind="book">📗 Books &amp; chapters</span>
      <select id="sub" hidden></select>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
      <select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Title A–Z</option></select>
    </div>
  </div>
  <div class="list" id="list"></div>
</main>
<footer id="foot"></footer>

}
function render(){
  const q=state.q.toLowerCase().trim().split(/\s+/).filter(Boolean);

  const yn=r=>parseInt(r.year)||0;
  rs.sort(state.sort==='az'?(a,b)=>a.title.localeCompare(b.title):state.sort==='old'?(a,b)=>yn(a)-yn(b)||a.title.localeCompare(b.title):(a,b)=>yn(b)-yn(a)||a.title.localeCompare(b.title));
